vmType: qemu
arch: aarch64
cpus: 4
# Ceiling, not a reservation: vz demand-faults pages and macOS compresses
# cold ones, so idle RSS sits well below this. Sized for nvim + a coding
# agent + a browser without thrashing.
memory: "8GiB"

# Memory ballooning (cooperative reclaim): not enabled.
#
# Lima 2.1.2 links the vz balloon device library but does not expose a
# user-facing yaml field for it (no `memoryBalloon:` knob). The guest is
# prepared — `boot.kernelModules = [ "virtio_balloon" ]` in full.nix — so
# this flips on the day Lima upstream surfaces the option (or we switch
# to `vmType: qemu` and pass `-device virtio-balloon-pci` via vmOpts).
# Until then we rely on macOS's passive compression + the in-guest
# drop-caches timer (also in full.nix) to keep idle RSS down.
# Root disk: disposable instance state. Durable data lives on the named
# additional disks below.
disk: "40GiB"

# Durable named disks. The host wrapper creates/links these before start.
# format:false because bootstrap services own the ext4 filesystems, and
# private-vm-init-home owns the encrypted home formatting.
additionalDisks:
  - name: "private-home"
    format: false
  - name: "private-nix"
    format: false
  - name: "private-persistence"
    format: false

# Skip Lima's guestagent + lima-specific cidata bootstrap. The image already
# has igor's account with Lima's agent pubkey authorised (baked at build time),
# so we don't need Lima's runtime user-injection step. plain:true also skips
# the cosmetic "fatal: did not receive a 'running' status" log.
plain: true

# Image path is rewritten by the launcher to point at the qcow built from
# nixosConfigurations.private-vm-bootstrap (upstream system.build.images.qemu-efi).
images:
  - location: "PLACEHOLDER_IMAGE_PATH"
    arch: aarch64

# No host filesystem mounts — host code reaches the VM via rsync-over-SSH in
# private-vm-rebuild, never via shared mounts. Keeps the isolation boundary
# explicit and the workflow hypervisor-agnostic.
mounts: []

# Matches the bootstrap user baked into the image (bootstrap.nix). The real
# user (from flake.privateVm.username) is a separate account created by the
# in-VM rebuild, only used for RDP sessions.
user:
  name: "nixos"
  home: "/home/nixos"
  uid: 1000

ssh:
  loadDotSSHPubKeys: false
  localPort: 60022

containerd:
  system: false
  user: false
