vmType: vz
arch: aarch64
cpus: 4
memory: "4GiB"
# Root disk: nix store + system state. Home data lives on the separate
# encrypted volume below (additionalDisks), not here.
disk: "40GiB"

# Encrypted home volume. Create once with:
#   limactl disk create private-home --size 40GiB
# Lima stores it in $LIMA_HOME/_disks/private-home/ and does NOT delete it on
# `limactl delete` — only `limactl disk delete private-home` removes it. The
# private-vm wrappers set LIMA_HOME to an isolated XDG state path.
# format:false because we manage LUKS formatting ourselves via private-vm-init-home.
additionalDisks:
  - name: "private-home"
    format: false

# Skip Lima's guestagent + lima-specific cidata bootstrap. The image already
# has igor's account with Lima's agent pubkey authorised (baked at build time),
# so we don't need Lima's runtime user-injection step. plain:true also skips
# the cosmetic "fatal: did not receive a 'running' status" log.
plain: true

# Image path is rewritten by the launcher to point at the qcow built from
# nixosConfigurations.private-vm-bootstrap (upstream system.build.images.qemu-efi).
images:
  - location: "PLACEHOLDER_IMAGE_PATH"
    arch: aarch64

# No host filesystem mounts — host code reaches the VM via rsync-over-SSH in
# private-vm-rebuild, never via shared mounts. Keeps the isolation boundary
# explicit and the workflow hypervisor-agnostic.
mounts: []

# Matches the bootstrap user baked into the image (bootstrap.nix). The real
# user (from flake.privateVm.username) is a separate account created by the
# in-VM rebuild, only used for RDP sessions.
user:
  name: "nixos"
  home: "/home/nixos"
  uid: 1000

ssh:
  loadDotSSHPubKeys: false
  localPort: 60022

containerd:
  system: false
  user: false
